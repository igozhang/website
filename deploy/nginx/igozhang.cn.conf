# https://igozhang.cn/ 反代到 Kubernetes Ingress（host 与 deploy/k8s/ingress.yaml 一致）。
# Ingress 已配置 TLS（Secret igozhang-cn-tls）；本机 Nginx 亦可终结证书，二者择一或并存。
# 请将 proxy_pass 端口改为本机 Ingress Controller 的 NodePort（HTTP 常见 30080）。
# 证书：宿主机 /data/igozhang.cn/tls/（与 K8s volumes.hostPath 一致）

server {
    listen 80;
    listen [::]:80;
    server_name igozhang.cn;

    location / {
        proxy_pass http://127.0.0.1:30080/;
        proxy_set_header Host igozhang.cn;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 7200s;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        client_max_body_size 0;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name igozhang.cn;

    ssl_certificate     /data/igozhang.cn/tls/igozhang.cn.pem;
    ssl_certificate_key /data/igozhang.cn/tls/igozhang.cn.key;

    location / {
        proxy_pass http://127.0.0.1:30080/;
        proxy_set_header Host igozhang.cn;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 7200s;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        client_max_body_size 0;
    }
}
