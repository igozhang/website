# igozhang — 字段说明见文件末尾
# 内置配置唯一源码（//go:embed）。修改后请执行：go generate ./cmd/igozhang/...
# 会同步到 deploy/secret07/igo.conf（仓库部署示例与 CI 校验）

[site]
# title = 网站名 [短句]；仅网站名时短句默认为 Practice makes perfect
title = igozhang
beijing_offset_hours = 0
banner_mask = 66

[igokey]
enabled = on

[auth]
enabled = on

[ops]
enabled = on
board_poll_interval = 5s
session_idle_timeout = 30m

[global]
maintenance_interval = 1h

[footer]
gomoku = /gomoku
xiangqi = /xiangqi
texas = /texas
max_links = 6
link = igozhang.cn | https://igozhang.cn

[stash]
max_size = 200K
ttl = 12h
poll_interval = 3s
poll_interval_max = 30s

[transfer]
file_max_age = 7d
dir_max_size = 9G
usage_baseline = 9G
max_concurrent_per_ip = 2
upload_max_size = 2G
fetch_timeout = 30m

[ratelimit]
browse_per_minute = 150
stash_per_minute = 80

[security]
path_probe_enabled = on
path_probe_window = 1m
path_probe_max_paths = 20
path_probe_ban_duration = 1h
path_probe_exclude_prefix = /stream/mp3/,/assets/doc-pic/

[log]
file_max_age = 15d
rotate_size = 500K
truncate_size = 1M

[preview]
max_size = 4M

[doc]
home_latest = 5
nav_ball = on

[mp3]
min_buffer = 512K
prefetch_ahead = 10
stall_timeout = 4.5s
max_stall_retries = 4
cover_max_size = 8M
gate_enabled = on
gate_ttl = 12h
referer_check = on
max_concurrent_per_ip = 4
max_tracks_per_minute = 40

[dice]
roll_duration = 1.15s
result_show = 2.2s

[xiangqi]
easy_depth = 2
easy_time_ms = 700
hard_depth = 3
hard_time_ms = 1600

[texas]
starting_chips = 2000
small_blind = 10
big_blind = 20
max_raises_per_round = 2
easy_think_ms = 500
hard_think_ms = 2000

[zhijian]
fuse_duration = 4s
fuse_combo_after = 5
fuse_combo_bonus = 500ms
fuse_urgent = 800ms
session_duration = 150s
min_record = 30s
combo_accum_after = 3
combo_danmaku_after = 5
combo_danmaku_each_after = 8
combo_decay_per_sec = 0.038
title_cpm = 30,50,65,75,95,150
word3k_pool_size = 80

# =============================================================================
# 说明（查阅用，日常只改上方配置）
# =============================================================================
# 路径：DATA_ROOT/secret07/igo.conf（首次启动从内嵌全文复制；已存在则不会覆盖）
# 生效：仅 Pod/进程启动时读取；修改后须重启 Deployment，不热加载
# 前端 __fs*Ops 与 GET /api/ops-config 来自本次启动快照
#
# 单位：大小 200K、4M、9G（1024 进制）；时长 100ms、4s、3m、1h、7d
#
# 环境变量（优先于本文件对应项）：
#   LISTEN                         — 监听地址（默认 :3003）
#   DATA_ROOT                      — 数据根目录（容器内默认 /igozhang.cn）
#   TRANSFER_SUBDIR                — 中转子目录名（默认 fs）
#   BASE_PATH                      — HTTP 子路径前缀（根路径部署留空）
#   DOC_ASSETS_SEED                — 首次 md 为空时从该目录复制 assets（默认 assets）
#   TRANSFER_MAX_CONCURRENT_PER_IP → [transfer] max_concurrent_per_ip
#   FS_USAGE_BASELINE_BYTES        → [transfer] usage_baseline
#
# DATA_ROOT 目录布局（摘要）：
#   assets/              — 站点内容与媒体（见下）
#     md/                — 文章 Markdown 正文
#     doc-pic/           — 文章图片
#     mp3/               — MP3 音频（播放器列表仅此目录一层，无子目录递归）
#     eng/phrases.md     — 页眉引语外部库（≥150 条有效行启用，否则内嵌样本）
#     eng/word3k-full.md — 知键词库外部库（≥50 条有效行启用，否则内嵌样本）
#   secret07/            — 运维与配置（不出现在目录浏览列表）
#     igo.conf           — 本文件
#     sqlitedb/doc.db    — 文章 SQLite 索引（含 -wal/-shm）
#     ssh.pass           — 运维 SSH 凭证
#     common-commands.md — 运维页常用命令快捷按钮
#     ip-blacklist.conf  — IP 黑名单（精确 IP；命中全站 403）
#     ip-whitelist.conf  — IP 白名单（非空时仅允许 /ops /igoadmin /fs /api/auth）
#     user-access.log    — 访客访问日志（独立轮转）
#     favicon.* / banner.* — 站点图标与页眉背景（见 pic.readme.md）
#   fs/                  — 文件中转（或 TRANSFER_SUBDIR 改名）
#   secret-tempfile/     — 文本暂存 stash.json、文章 ZIP 导出缓存 doc-export.zip
#   secret-log/          — 运行日志
#
# [site] title = 网站名 [短句]（空格分隔）；仅网站名时短句默认 Practice makes perfect；首页 document.title 用网站名
#   beijing_offset_hours — 北京时间显示修正（UTC+8 上叠加 ±0~12，仅展示）
#   banner_mask — 页眉 banner 蒙版 0–100（0=全透明，100=全遮挡；默认 66 为当前效果）
#
# [igokey] GET /igokey?format=plain|json；HTML 页 404；enabled=off 时接口亦 404
# [auth] POST /api/auth/login|/api/auth/session；enabled=off 或 [igokey] off 时认证接口 404（fs/igoadmin/ops 共用）
# [ops] GET /ops；enabled=off 时仅 ops 页/API 404（不关闭 fs/igoadmin 认证）；SSH 凭证 secret07/ssh.pass；常用命令 secret07/common-commands.md
#
# [global] 维护任务：清理过期中转、超 TTL 暂存、日志目录
#   maintenance_interval — 间隔（代码最小抬到 1h）
#
# [footer] 页脚 + GET /api/footer
#   gomoku — 五子棋链接（/gomoku 或 https://…）
#   xiangqi — 象棋链接（/xiangqi 或 https://…）
#   texas — 德扑链接（/texas 或 https://…）
#   max_links — 底栏外链条数上限（1–20）
#   link — 多行「文字 | URL」
#
# [stash] 首页暂存，DATA_ROOT/secret-tempfile/stash.json
#   max_size — 正文最大 UTF-8 字节（超出 413）
#   ttl — 未更新超过此时长由维护任务删除
#   poll_interval / poll_interval_max — 多标签轮询 /api/stash 间隔与退避上限（最小 3s）
#
# [transfer] 中转目录 DATA_ROOT/fs（可由 TRANSFER_SUBDIR 改名）
#   file_max_age — 单文件按 mtime 保留上限
#   dir_max_size — 目录总占用上限
#   usage_baseline — 用量条分母（0 或未配默认同 dir_max_size）
#   max_concurrent_per_ip — 同 IP 并发上传+拉取槽位（1–32）
#   upload_max_size — 单次 multipart 上限
#   fetch_timeout — 外网 URL 拉取 HTTP 超时
#
# [ratelimit] 按 IP 滑动分钟窗口，超限 429
#   browse_per_minute — GET /api/browse（含 MP3 列表专用 path=assets/mp3）
#   stash_per_minute — GET/POST/DELETE /api/stash
#
# [security] 路径探测自动封禁（滑动窗口 + ip-auto-ban.json 临时封禁，不写入 ip-blacklist.conf）
#   path_probe_enabled — on/off（默认 on）
#   path_probe_window — 统计窗口（10s–10m，默认 1m）
#   path_probe_max_paths — 窗口内不同路径数阈值（5–100，默认 20）
#   path_probe_ban_duration — 临时封禁时长（5m–24h，默认 1h）
#   path_probe_exclude_prefix — 逗号分隔路径前缀，不计入探测（默认 /stream/mp3/,/assets/doc-pic/）
#
# [log] DATA_ROOT/secret-log（igozhang.log）与 secret07/user-access.log（访客，独立轮转）
#   file_max_age — 运行日志归档保留时长（默认 15d）；user-access.log 独立轮转见 access_log.go
#   rotate_size — 当前日志超过则轮转（默认 500K）
#   truncate_size — 当前日志超过则截断为最近 100 行并清空归档（默认 1M）
#   dir_max_size — 已废弃，兼容旧配置忽略
#
# [auth] 统一 key 会话（ops/igoadmin/fs）
#   enabled — on/off（默认 on；与 [igokey] 同时为 on 时 authFeatureEnabled）
#
# [ops] GET /ops；看板、黑名单、白名单、user-access.log 见 README §8
#   enabled — on/off（默认 on；仅控制 ops 页与 /api/ops/*，不控制认证）
#   board_poll_interval — 看板轮询间隔（3s–60s，默认 5s）
#   session_idle_timeout — 访客会话空闲超时（5m–6h，默认 30m；超时后下次访问计新会话）
#
# [preview] 浏览列表常见文本在线预览（txt/md/js/yaml/toml/conf/json/go 等）
#   max_size — GET /preview/... 体积上限
#
# [doc] 文章站（正文 assets/md/；索引 secret07/sqlitedb/doc.db）
#   home_latest — 首页每页条数（1–50）；支持 ?category= 与 ?page= 分页
#   nav_ball — 全站圆形导航球（文档页桌面侧栏/其余页固定浮球；off 关闭）
#   备份/迁移：后台 /igoadmin 导出 ZIP → 导入 ZIP（合并：不删 ZIP 外本地 md；md 一致则跳过覆盖）
#   可选 secret07：igo.conf、link.conf、ssh.pass、common-commands.md、banner/favicon/texas、ip-blacklist.conf、ip-whitelist.conf、user-access-bundle.json
#   导出缓存：secret-tempfile/doc-export.zip（文章变更后约 3s 防抖预生成）
#
# [mp3] 播放器（磁盘 assets/mp3/；URL 仍为 /stream/mp3/…；__fsMp3Ops）
#   min_buffer — 播放前最少缓冲
#   prefetch_ahead — 预取下一曲提前秒数（默认 10；过大易与主槽争带宽）
#   stall_timeout — 判定卡顿无进度时长
#   max_stall_retries — 单次播放卡顿重试次数
#   cover_max_size — ID3/APIC 封面提取上限
#   gate_enabled — 同源门禁 Cookie（on/off；默认 on；关则流/封面/列表不校验）
#   gate_ttl — 门禁 Cookie 有效期（默认 12h）
#   referer_check — 有 Referer/Origin 时须本站同源；空 Referer 放行（默认 on）
#   max_concurrent_per_ip — 同 IP 并发流槽位（1–32，默认 4；含预取）
#   max_tracks_per_minute — 同 IP 每分钟不同曲目上限（5–500，默认 40）
#
# [dice] 页脚骰子动画（__fsDiceOps）
#   roll_duration — 旋转时长
#   result_show — 点数展示后关闭遮罩延迟
#
# [xiangqi] GET /xiangqi 象棋（__fsXiangqiOps）
#   easy_depth / easy_time_ms — 简单难度搜索
#   hard_depth / hard_time_ms — 困难难度搜索
#
# [texas] GET /texas 德州扑克（__fsTexasOps）
#   starting_chips / small_blind / big_blind — 筹码与盲注
#   max_raises_per_round — 每轮最大加注次数
#   easy_think_ms / hard_think_ms — AI 假思考随机延迟区间（毫秒，含端点）
#   牌背：secret07/texas.{png,jpg,jpeg}（≤150K，经 /texas-card-back.* 提供）
#
# [zhijian] GET /zhijian 知键（__fsZjOps）
#   fuse_duration — 每字母引信
#   fuse_combo_after / fuse_combo_bonus — 连击后引信加长
#   fuse_urgent — 引信低于此值红色急促动画
#   session_duration — 一局默认时长
#   min_record — 写入本地 TOP3 最短有效时长
#   combo_accum_after — 连击条开始填充阈值
#   combo_danmaku_after / combo_danmaku_each_after — 弹幕鼓励
#   combo_decay_per_sec — 连击条每秒衰减
#   title_cpm — 称号 CPM 分段（逗号递增整数，至少 2 段）
#   word3k_pool_size — 每次刷新页面随机词条数（10–500）
#   词库：assets/eng/word3k-full.md 优先，否则内嵌样本；启动载入工作集 min(1000, pool×10) 条
