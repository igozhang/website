<!DOCTYPE html>
<html lang="zh-CN">
<head>
{{PAGE_HEAD}}
<title>Mermaid 预览</title>
<style>
:root{--bg:#e8efe8;--panel:#dde8dd;--text:#2d3b2d;--muted:#5a6b5a;--accent:#3d6b4a;--line:#b8c9b8}
*{box-sizing:border-box}
html{width:100%;overflow-x:hidden}
body{margin:0;width:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:stretch}
.mermaid-page{width:100%;padding:.25rem 0 1rem}
.mermaid-page h2{font-size:1.05rem;margin:0 0 .65rem;font-weight:600;text-align:center}
.mermaid-toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;margin-bottom:.65rem}
.mermaid-btn{font:inherit;font-size:.82rem;padding:.32rem .75rem;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--accent);cursor:pointer;white-space:nowrap}
.mermaid-btn:hover{background:rgba(61,107,74,.1)}
.mermaid-btn:active{transform:translateY(1px)}
.mermaid-btn.is-active{border-color:var(--accent);background:rgba(61,107,74,.15)}
.mermaid-btn:disabled{opacity:.55;cursor:not-allowed}
.mermaid-workspace{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;align-items:stretch}
.mermaid-pane{display:flex;flex-direction:column;gap:.35rem;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem}
.mermaid-pane-head{display:flex;align-items:center;justify-content:space-between;gap:.45rem;min-width:0}
.mermaid-pane-head label{font-size:.82rem;color:var(--muted);font-weight:600;margin:0}
.mermaid-pane-head .mermaid-btn{font-size:.76rem;padding:.22rem .55rem}
.mermaid-src{flex:1 1 auto;width:100%;min-height:16rem;resize:vertical;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.82rem;line-height:1.45;padding:.45rem .55rem;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.45);color:var(--text)}
.mermaid-src:focus{outline:2px solid rgba(61,107,74,.35);outline-offset:1px}
.mermaid-preview{flex:1 1 auto;min-height:16rem;margin:0!important;padding:.35rem;background:rgba(255,255,255,.35);border:1px dashed var(--line);border-radius:8px;display:flex;align-items:flex-start;justify-content:center}
.mermaid-preview:empty::before{content:"输入 Mermaid 源码后在此预览";color:var(--muted);font-size:.84rem;padding:1rem;text-align:center;width:100%}
.mermaid-hint{font-size:.8rem;color:var(--muted);text-align:center;margin:.55rem 0 0;line-height:1.45}

/* K8MAN-style right drawer */
.mmd-drawer-backdrop{position:fixed;inset:0;background:rgba(45,59,45,.28);z-index:40}
.mmd-drawer{
  position:fixed;top:0;right:0;height:100%;width:min(880px,100%);
  max-width:100%;min-width:min(420px,100%);
  background:var(--panel);z-index:41;padding:16px;box-sizing:border-box;
  box-shadow:-8px 0 24px rgba(45,59,45,.12);
  display:flex;flex-direction:column;overflow:hidden;
}
.mmd-drawer[hidden],.mmd-drawer-backdrop[hidden]{display:none!important}
.mmd-drawer-resize{
  position:absolute;left:0;top:0;width:10px;height:100%;
  cursor:ew-resize;z-index:3;touch-action:none;
}
.mmd-drawer-resize:hover,body.is-mmd-drawer-resizing .mmd-drawer-resize{background:rgba(45,59,45,.14)}
body.is-mmd-drawer-resizing{cursor:ew-resize;user-select:none}
body.is-mmd-drawer-open{overflow:hidden}
.mmd-drawer-toolbar{
  flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:.45rem .55rem;margin-bottom:8px;min-width:0;
}
.mmd-drawer-toolbar strong{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:.95rem;color:var(--text);
}
.mmd-drawer-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;flex-shrink:0}
.mmd-drawer-actions .mermaid-btn{font-size:.76rem;padding:.22rem .55rem;background:var(--bg)}
.mmd-drawer-zoom-label{
  font-size:.76rem;color:var(--muted);min-width:3.2rem;text-align:center;font-variant-numeric:tabular-nums;
}
.mmd-drawer-scroll{
  flex:1 1 auto;min-height:0;overflow:auto;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.45rem;
}
.mmd-drawer-sizer{position:relative}
.mmd-drawer-zoom{transform:none}
.mmd-drawer-hint{flex-shrink:0;margin:.45rem 0 0;font-size:.76rem;color:var(--muted);line-height:1.35}

@media (max-width:820px){
  .mermaid-workspace{grid-template-columns:1fr}
  .mermaid-src,.mermaid-preview{min-height:12rem}
  main.shell.fs-page-body{padding-left:.5rem;padding-right:.5rem}
  .mmd-drawer{width:100%!important;min-width:0}
}
{{MERMAID_CSS}}
/* After MERMAID_CSS: win over .doc-mermaid-wrap max-width/overflow (do not set svg width:auto — it overrides width attrs). */
.mmd-drawer-preview.doc-mermaid-wrap{
  margin:0!important;padding:0;background:transparent;border:none;display:block;text-align:left;
  max-width:none!important;overflow:visible!important;width:max-content;min-width:0;
}
.mmd-drawer-preview.doc-mermaid-wrap svg{max-width:none!important;background:transparent}
.mmd-drawer-preview:empty::before{content:"暂无图表";color:var(--muted);font-size:.84rem;padding:1rem;display:block}
{{SITE_HEAD_CSS}}
</style>
</head>
<body>
{{SITE_HEAD}}
<main class="shell fs-page-body" data-fs-pub="{{FS_PUB_ATTR}}">
<section class="mermaid-page fs-module" data-fs-module="mermaid" aria-label="Mermaid 预览">
<h2>Mermaid 预览</h2>
<div class="mermaid-toolbar" role="toolbar" aria-label="Mermaid 操作">
<button type="button" class="mermaid-btn is-active" data-mmd-example="flowchart">流程图</button>
<button type="button" class="mermaid-btn" data-mmd-example="sequence">时序图</button>
<button type="button" class="mermaid-btn" data-mmd-example="class">类图</button>
<button type="button" class="mermaid-btn" data-mmd-example="gantt">甘特图</button>
<button type="button" class="mermaid-btn" data-mmd-example="state">状态图</button>
<button type="button" class="mermaid-btn" data-mmd-example="free">自由</button>
<button type="button" class="mermaid-btn" id="btnMmdPng" title="导出为 PNG 图片">导出 PNG</button>
<button type="button" class="mermaid-btn" id="btnMmdCopy" title="复制源码">复制</button>
<button type="button" class="mermaid-btn" id="btnMmdClear" title="恢复默认示例">清空</button>
</div>
<div class="mermaid-workspace">
<div class="mermaid-pane">
<label for="mermaidSrc">源码</label>
<textarea class="mermaid-src" id="mermaidSrc" spellcheck="false" aria-label="Mermaid 源码">flowchart TB
  A[开始] --> B{判断}
  B -->|是| C[处理]
  B -->|否| D[结束]
  C --> D</textarea>
</div>
<div class="mermaid-pane">
<div class="mermaid-pane-head">
<label for="mermaidPreview">预览</label>
<button type="button" class="mermaid-btn" id="btnMmdDrawer" title="在右侧大图预览中查看">大图预览</button>
</div>
<div id="mermaidPreview" class="mermaid-preview doc-mermaid-wrap" aria-live="polite"></div>
</div>
</div>
<p class="mermaid-hint">选择示例模板快速开始，或点「自由」空白编写；修改源码后约 0.3 秒自动刷新预览。点「大图预览」可在右侧抽屉查看并缩放导出。</p>
</section>
</main>

<div id="mmdDrawerBackdrop" class="mmd-drawer-backdrop" hidden></div>
<aside id="mmdDrawer" class="mmd-drawer" hidden role="dialog" aria-modal="true" aria-labelledby="mmdDrawerTitle">
  <div class="mmd-drawer-resize" id="mmdDrawerResize" title="拖拽调整宽度"></div>
  <div class="mmd-drawer-toolbar">
    <strong id="mmdDrawerTitle">大图预览</strong>
    <div class="mmd-drawer-actions">
      <button type="button" class="mermaid-btn" id="btnMmdZoomOut" title="缩小至 1/1.25">−</button>
      <span class="mmd-drawer-zoom-label" id="mmdZoomLabel" aria-live="polite">100%</span>
      <button type="button" class="mermaid-btn" id="btnMmdZoomIn" title="放大 1.25 倍">+</button>
      <button type="button" class="mermaid-btn" id="btnMmdZoom100" title="实际大小">100%</button>
      <button type="button" class="mermaid-btn" id="btnMmdZoomFit" title="适应宽度">适应宽度</button>
      <button type="button" class="mermaid-btn" id="btnMmdDrawerPng" title="导出为 PNG 图片">导出 PNG</button>
      <button type="button" class="mermaid-btn" id="btnMmdDrawerClose">关闭</button>
    </div>
  </div>
  <div class="mmd-drawer-scroll" id="mmdDrawerScroll">
    <div class="mmd-drawer-sizer" id="mmdDrawerSizer">
      <div class="mmd-drawer-zoom" id="mmdDrawerZoom">
        <div id="mmdDrawerPreview" class="mmd-drawer-preview doc-mermaid-wrap" aria-live="polite"></div>
      </div>
    </div>
  </div>
  <p class="mmd-drawer-hint">默认实际大小（可滚动）；「适应宽度」可看全图。源码变更会同步；可拖左缘改宽。</p>
</aside>

{{SITE_SUBPAGE_TAIL}}
{{MERMAID_SCRIPTS}}
<script>
(function(){
  "use strict";
  var srcEl=document.getElementById("mermaidSrc");
  var previewEl=document.getElementById("mermaidPreview");
  var drawerEl=document.getElementById("mmdDrawer");
  var backdropEl=document.getElementById("mmdDrawerBackdrop");
  var drawerPreviewEl=document.getElementById("mmdDrawerPreview");
  var drawerScrollEl=document.getElementById("mmdDrawerScroll");
  var drawerSizerEl=document.getElementById("mmdDrawerSizer");
  var drawerZoomEl=document.getElementById("mmdDrawerZoom");
  var zoomLabelEl=document.getElementById("mmdZoomLabel");
  var debounceTimer=null;
  var drawerOpen=false;
  var drawerRenderSeq=0;
  var zoom=1;
  // 0.05 so「适应宽度」能装下超宽 flowchart
  var ZOOM_MIN=0.05;
  var ZOOM_MAX=3;
  var ZOOM_FACTOR=1.25;
  var DRAWER_W_MIN=420;
  var DRAWER_W_KEY="igo.mermaidDrawerPx";
  var drawerWidth=880;
  var EXAMPLES={
    flowchart:"flowchart TB\n  A[开始] --> B{判断}\n  B -->|是| C[处理]\n  B -->|否| D[结束]\n  C --> D",
    sequence:"sequenceDiagram\n  participant A as 用户\n  participant B as 服务\n  A->>B: 请求\n  B-->>A: 响应",
    class:"classDiagram\n  class Animal {\n    +name: string\n    +move()\n  }\n  class Dog {\n    +bark()\n  }\n  Animal <|-- Dog",
    gantt:"gantt\n  title 项目计划\n  dateFormat YYYY-MM-DD\n  section 阶段一\n  需求分析 :a1, 2026-01-01, 7d\n  section 阶段二\n  开发实现 :a2, after a1, 14d\n  测试验收 :a3, after a2, 7d",
    state:"stateDiagram-v2\n  [*] --> 待处理\n  待处理 --> 进行中 : 开始\n  进行中 --> 已完成 : 完成\n  进行中 --> 已取消 : 取消\n  已完成 --> [*]\n  已取消 --> [*]",
    free:""
  };
  function matchExampleKey(text){
    var t=(text||"").replace(/^\n+|\n+$/g,"");
    for(var key in EXAMPLES){
      if(key==="free") continue;
      if(EXAMPLES[key]===t) return key;
    }
    return "free";
  }
  function setActiveExample(key){
    document.querySelectorAll("[data-mmd-example]").forEach(function(btn){
      btn.classList.toggle("is-active",btn.getAttribute("data-mmd-example")===key);
    });
  }
  function scheduleRender(){
    clearTimeout(debounceTimer);
    debounceTimer=setTimeout(doRender,300);
  }
  function afterDrawerPaint(fn){
    requestAnimationFrame(function(){
      requestAnimationFrame(fn);
    });
  }
  function doRender(){
    if(typeof renderMermaidSource!=="function") return;
    var p=renderMermaidSource(srcEl.value,previewEl);
    if(!drawerOpen) return;
    var seq=++drawerRenderSeq;
    Promise.resolve(p).then(function(){
      if(!drawerOpen||seq!==drawerRenderSeq) return null;
      return renderMermaidSource(srcEl.value,drawerPreviewEl);
    }).then(function(){
      if(!drawerOpen||seq!==drawerRenderSeq) return;
      afterDrawerPaint(function(){
        if(!drawerOpen||seq!==drawerRenderSeq) return;
        updateZoomLayout();
      });
    }).catch(function(){ /* renderMermaidSource 已在目标区展示错误 */ });
  }
  function waitAndRender(){
    var n=0;
    var timer=setInterval(function(){
      n+=1;
      if(typeof renderMermaidSource==="function"&&window.mermaid){
        clearInterval(timer);
        doRender();
      }else if(n>=80){
        clearInterval(timer);
      }
    },50);
  }
  function setExample(key){
    if(!(key in EXAMPLES)) return;
    srcEl.value=EXAMPLES[key];
    setActiveExample(key);
    if(key==="free"){
      srcEl.focus();
    }
    scheduleRender();
  }
  function onSrcInput(){
    setActiveExample(matchExampleKey(srcEl.value));
    scheduleRender();
  }
  function copySrc(){
    var text=srcEl.value||"";
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
      return;
    }
    fallbackCopy(text);
  }
  function fallbackCopy(text){
    srcEl.focus();
    srcEl.select();
    try{ document.execCommand("copy"); }catch(e){}
  }
  function exportPng(btn, previewRoot){
    if(!btn) return;
    btn.disabled=true;
    var label=btn.getAttribute("data-label")||"导出 PNG";
    function done(){ btn.disabled=false; btn.textContent=label; }
    if(typeof exportMermaidPngFromSource!=="function"){
      alert("导出功能未加载，请刷新页面后重试");
      done();
      return;
    }
    btn.textContent="导出中…";
    exportMermaidPngFromSource(srcEl.value,"mermaid-"+Date.now()+".png",2,previewRoot||previewEl)
      .then(done)
      .catch(function(err){
        alert("导出失败："+(err&&err.message?err.message:String(err||"unknown")));
        done();
      });
  }

  function drawerMinWidth(){
    return Math.min(DRAWER_W_MIN, window.innerWidth);
  }
  function clampDrawerWidth(n){
    return Math.min(window.innerWidth, Math.max(drawerMinWidth(), n));
  }
  function applyDrawerWidth(){
    if(window.innerWidth<=820){
      drawerEl.style.width="100%";
      return;
    }
    drawerEl.style.width=clampDrawerWidth(drawerWidth)+"px";
  }
  function initDrawerWidth(){
    try{
      var n=Number(localStorage.getItem(DRAWER_W_KEY));
      if(Number.isFinite(n) && n>=DRAWER_W_MIN){
        drawerWidth=clampDrawerWidth(n);
        applyDrawerWidth();
        return;
      }
    }catch(e){}
    drawerWidth=clampDrawerWidth(880);
    applyDrawerWidth();
  }
  function stopDrawerResize(){
    document.body.classList.remove("is-mmd-drawer-resizing");
  }
  function startDrawerResize(e){
    if(window.innerWidth<=820) return;
    if(typeof e.button==="number"&&e.button!==0) return;
    var startX=e.clientX;
    var startW=drawerEl.getBoundingClientRect().width;
    var handle=e.currentTarget;
    if(handle.setPointerCapture) handle.setPointerCapture(e.pointerId);
    function onMove(ev){
      drawerWidth=clampDrawerWidth(startW+(startX-ev.clientX));
      applyDrawerWidth();
      if(drawerOpen) requestAnimationFrame(updateZoomLayout);
    }
    function onUp(ev){
      if(handle.releasePointerCapture) handle.releasePointerCapture(ev.pointerId);
      handle.removeEventListener("pointermove",onMove);
      handle.removeEventListener("pointerup",onUp);
      handle.removeEventListener("pointercancel",onUp);
      stopDrawerResize();
      try{ localStorage.setItem(DRAWER_W_KEY,String(Math.round(drawerWidth))); }catch(err){}
    }
    document.body.classList.add("is-mmd-drawer-resizing");
    handle.addEventListener("pointermove",onMove);
    handle.addEventListener("pointerup",onUp);
    handle.addEventListener("pointercancel",onUp);
  }

  function formatZoom(z){
    return Math.round(z*100)+"%";
  }
  // Intrinsic size from viewBox (cached). Never use current display width — that already includes zoom.
  function readIntrinsicSize(){
    var svg=drawerPreviewEl.querySelector("svg");
    if(!svg) return {w:0,h:0};
    var cachedW=parseFloat(svg.getAttribute("data-igo-iw")||"");
    var cachedH=parseFloat(svg.getAttribute("data-igo-ih")||"");
    if(cachedW>0&&cachedH>0) return {w:cachedW,h:cachedH};
    var w=0,h=0;
    var vbAttr=svg.getAttribute("viewBox");
    if(vbAttr){
      var parts=vbAttr.trim().split(/[\s,]+/);
      if(parts.length===4){
        w=parseFloat(parts[2]);
        h=parseFloat(parts[3]);
      }
    }
    if(!(w>0&&h>0)){
      var vb=svg.viewBox&&svg.viewBox.baseVal;
      if(vb&&vb.width>0&&vb.height>0){ w=vb.width; h=vb.height; }
    }
    if(!(w>0&&h>0)){
      // First layout only; cache immediately so later zoom passes do not compound.
      w=drawerPreviewEl.scrollWidth||drawerPreviewEl.offsetWidth||0;
      h=drawerPreviewEl.scrollHeight||drawerPreviewEl.offsetHeight||0;
    }
    if(w>0&&h>0){
      svg.setAttribute("data-igo-iw",String(w));
      svg.setAttribute("data-igo-ih",String(h));
    }
    return {w:w,h:h};
  }
  // Vector zoom: keep viewBox, set display width/height (no CSS transform — foreignObject stays sharp).
  function updateZoomLayout(){
    if(!drawerOpen) return;
    if(drawerZoomEl){
      drawerZoomEl.style.transform="";
      drawerZoomEl.style.transformOrigin="";
    }
    zoomLabelEl.textContent=formatZoom(zoom);
    var svg=drawerPreviewEl.querySelector("svg");
    var size=readIntrinsicSize();
    if(!svg||!(size.w>0)||!(size.h>0)){
      drawerSizerEl.style.width="";
      drawerSizerEl.style.height="";
      return;
    }
    var w=Math.max(1,size.w*zoom);
    var h=Math.max(1,size.h*zoom);
    svg.setAttribute("width",String(w));
    svg.setAttribute("height",String(h));
    svg.style.maxWidth="none";
    svg.style.width=w+"px";
    svg.style.height=h+"px";
    drawerSizerEl.style.width=Math.ceil(w)+"px";
    drawerSizerEl.style.height=Math.ceil(h)+"px";
  }
  function setZoom(next){
    var z=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,next));
    zoom=Math.round(z*100)/100;
    updateZoomLayout();
  }
  function fitZoomWidth(){
    var size=readIntrinsicSize();
    if(!(size.w>0)){ setZoom(1); return; }
    var avail=Math.max(40, drawerScrollEl.clientWidth-8);
    setZoom(avail/size.w);
  }

  function openDrawer(){
    if(drawerOpen) return;
    drawerOpen=true;
    initDrawerWidth();
    backdropEl.hidden=false;
    drawerEl.hidden=false;
    document.body.classList.add("is-mmd-drawer-open");
    zoom=1;
    var seq=++drawerRenderSeq;
    if(typeof renderMermaidSource==="function"){
      Promise.resolve(renderMermaidSource(srcEl.value,drawerPreviewEl)).then(function(){
        if(!drawerOpen||seq!==drawerRenderSeq) return;
        afterDrawerPaint(function(){
          if(!drawerOpen||seq!==drawerRenderSeq) return;
          setZoom(1);
        });
      }).catch(function(){ /* 错误已写入抽屉预览区 */ });
    }else{
      afterDrawerPaint(function(){ setZoom(1); });
    }
    var closeBtn=document.getElementById("btnMmdDrawerClose");
    if(closeBtn) closeBtn.focus();
  }
  function closeDrawer(){
    if(!drawerOpen) return;
    drawerOpen=false;
    drawerRenderSeq+=1;
    backdropEl.hidden=true;
    drawerEl.hidden=true;
    document.body.classList.remove("is-mmd-drawer-open");
    stopDrawerResize();
    drawerPreviewEl.innerHTML="";
    drawerSizerEl.style.width="";
    drawerSizerEl.style.height="";
    if(drawerZoomEl){
      drawerZoomEl.style.transform="";
      drawerZoomEl.style.transformOrigin="";
    }
    zoom=1;
    zoomLabelEl.textContent="100%";
  }

  srcEl.addEventListener("input",onSrcInput);
  document.getElementById("btnMmdPng").setAttribute("data-label","导出 PNG");
  document.getElementById("btnMmdPng").addEventListener("click",function(){
    exportPng(document.getElementById("btnMmdPng"),previewEl);
  });
  document.getElementById("btnMmdCopy").addEventListener("click",copySrc);
  document.getElementById("btnMmdClear").addEventListener("click",function(){ setExample("flowchart"); });
  document.querySelectorAll("[data-mmd-example]").forEach(function(btn){
    btn.addEventListener("click",function(){
      setExample(btn.getAttribute("data-mmd-example"));
    });
  });

  document.getElementById("btnMmdDrawer").addEventListener("click",openDrawer);
  document.getElementById("btnMmdDrawerClose").addEventListener("click",closeDrawer);
  backdropEl.addEventListener("click",closeDrawer);
  document.getElementById("mmdDrawerResize").addEventListener("pointerdown",function(e){
    e.preventDefault();
    startDrawerResize(e);
  });
  document.getElementById("btnMmdDrawerPng").setAttribute("data-label","导出 PNG");
  document.getElementById("btnMmdDrawerPng").addEventListener("click",function(){
    exportPng(document.getElementById("btnMmdDrawerPng"),drawerPreviewEl);
  });
  document.getElementById("btnMmdZoomIn").addEventListener("click",function(){ setZoom(zoom*ZOOM_FACTOR); });
  document.getElementById("btnMmdZoomOut").addEventListener("click",function(){ setZoom(zoom/ZOOM_FACTOR); });
  document.getElementById("btnMmdZoom100").addEventListener("click",function(){ setZoom(1); });
  document.getElementById("btnMmdZoomFit").addEventListener("click",fitZoomWidth);
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&drawerOpen){
      e.preventDefault();
      closeDrawer();
    }
  });
  window.addEventListener("resize",function(){
    if(!drawerOpen) return;
    applyDrawerWidth();
    requestAnimationFrame(updateZoomLayout);
  });

  initDrawerWidth();
  waitAndRender();
})();
</script>
